# Written by hand rather than by `fdroid update --create-metadata`, which produces a
# stub naming the APK's own label and nothing else. Everything here is what the F-Droid
# client shows on the app's page, so it is the only description a person who is not in
# this household will ever read.

Categories:
  - Money

# Matches the LICENSE file at the repository root, and must keep matching it: this string
# is what every F-Droid client displays, and it is the only licence statement most people
# will ever see. SPDX identifier, not a friendly name — "GPL-3.0-only" and "GPL-3.0" and
# "GPLv3" are not interchangeable to the tools that read this.
License: GPL-3.0-only

AuthorName: Manuel Francis Correya
SourceCode: https://github.com/manuelfc1991/expense-tracker
IssueTracker: https://github.com/manuelfc1991/expense-tracker/issues

# Both are true and both are worth stating plainly. The sheet transport talks to Google
# Apps Script, and Bluetooth sync is built on play-services-nearby — the two reasons this
# app could not go in F-Droid's own repository.
AntiFeatures:
  - NonFreeNet
  - NonFreeDep

Name: Ours
Summary: Reads bank SMS into a shared household ledger

# One line per paragraph, however unwieldy that looks here. F-Droid renders a newline as
# a newline, so a description wrapped for readability in this file arrives on the phone
# broken mid-sentence at whatever column the editor happened to use. Checked on a
# screenshot, not assumed.
Description: |-
    A bank SMS is already a statement line. Ours reads the ones an Indian bank or UPI app sends, turns them into transactions, and keeps two phones in one household agreeing about them.

    * Parses debits, credits, card purchases, card bills and self-transfers out of SMS — no typing, no CSV, no bank login.
    * One budget over one household, not one per person: spending is measured against everything the household spent, whoever spent it.
    * Three kinds of account, because a balance means three different things. Money in a current account is available; money on a credit card is owed; money in an FD, an RD or a PPF is held. Only the first is safe to spend, and the app never quietly adds the other two to it.
    * Unknown is never zero. An account nobody has quoted a balance for is counted and reported as unknown, not summed as ₹0.
    * Syncs between phones over a Google Sheet the household owns, or directly over Bluetooth. There is no server and no account.

    Built for one household and sideloaded to two phones with real money in them, so it is opinionated about Indian bank message formats and makes no attempt to be a general-purpose tracker.

RepoType: git
Repo: https://github.com/manuelfc1991/expense-tracker.git

AutoUpdateMode: None
UpdateCheckMode: None

# Rewritten by tools/fdroid-publish.sh from the APK on every publish, so it is never
# edited by hand. It is not decoration: `fdroid update` attaches a changelog to a release
# only when its filename matches CurrentVersionCode, so a stale value here means
# `changelogs/78.txt` is written, committed, published — and silently never shown.
CurrentVersion: "7.8"
CurrentVersionCode: 80

# One entry per published release, newest last, and no build recipe in them — this repo
# ships binaries, it does not build from source.
#
# They are here for one reason. In index-v2, which is the format a current F-Droid client
# actually reads, a changelog is attached to a release only if the app has Builds and the
# release is the last of them (fdroidserver index.py). No Builds, no "What's New" — and
# nothing warns, because index-v1 carries the changelog perfectly well and index-v1 is
# what you would look at to check.
Builds:
  - versionName: "7.5"
    versionCode: 77
  - versionName: "7.6"
    versionCode: 78
  - versionName: "7.7"
    versionCode: 79
  - versionName: "7.8"
    versionCode: 80
